buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Ensure PATH includes common Node install locations for Exec tasks (Android Studio may have limited PATH)
gradle.projectsEvaluated {
    tasks.withType(Exec) { Exec t ->
        def currentPath = t.environment["PATH"] ?: System.getenv("PATH")
        def extraPaths = [
            "/usr/local/bin",
            "/opt/homebrew/bin"
        ]
        def newPath = (currentPath ? currentPath.split(":").toList() : [])
            .plus(extraPaths)
            .unique()
            .join(":")
        t.environment "PATH", newPath
    }
}
